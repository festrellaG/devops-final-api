# El token y la URL se inyectan desde la conexión Jenkins sonarqube-server.
sonar.projectKey=devops-final-api
sonar.projectName=devops-final-api
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Analizar la API; los scripts de empaquetado quedan fuera de este alcance inicial.
sonar.sources=src
sonar.tests=test
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Sigue incluido en análisis estático. Su arranque se prueba como proceso real,
# pero no se incluye en las métricas de cobertura de c8 ni de Sonar.
sonar.coverage.exclusions=src/server.js